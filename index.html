<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FutureFactor360 Tools</title>
  <meta name="description" content="FutureFactor360 proprietary tools and demos." />
  <link rel="icon" href="assets/futurefactor-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --navy-900: #0B2240; --navy-700: #163C70; --brand-600: #1E5BBE; --brand-500: #2B6FD6; --brand-300: #9CC3F7; --surface: #F3F6FB; --line: #E3E8F0; --ink-900: #111827; --ink-500: #6B7280; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--surface); color: var(--ink-900); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    .topbar { background: #fff; border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
    .topbar img { height: 36px; width: auto; display: block; }
    .topbar .sep { width: 1px; height: 28px; background: var(--line); }
    .topbar .title { font-size: 15px; font-weight: 600; white-space: nowrap; }
    .hero { background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 60%, var(--brand-600) 100%); color: #fff; }
    .hero-inner { max-width: 1100px; margin: 0 auto; padding: 44px 24px; }
    .hero h1 { font-size: 34px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; }
    .hero p { font-size: 16px; color: rgba(255,255,255,0.82); margin: 0; }
    main { max-width: 1100px; width: 100%; margin: 0 auto; padding: 32px 24px 56px; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; min-height: 190px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(16,24,40,0.04); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .tile:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(16,24,40,0.10); border-color: var(--brand-300); }
    .tile h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
    .tile p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-500); }
    .tile .open { margin-top: auto; padding-top: 12px; font-size: 14px; font-weight: 600; color: var(--brand-600); display: inline-flex; align-items: center; gap: 6px; }
    .tile:hover .open { color: var(--brand-500); }
    footer { border-top: 1px solid var(--line); background: #fff; }
    .footer-inner { max-width: 1100px; margin: 0 auto; padding: 18px 24px; font-size: 12.5px; color: var(--ink-500); }
    @media (max-width: 640px) { .hero h1 { font-size: 26px; } .hero-inner { padding: 32px 16px; } main, .topbar-inner, .footer-inner { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img src="assets/futurefactor-logo.png" alt="FutureFactor360" />
      <span class="sep"></span>
      <span class="title">Proprietary Tools</span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <h1>FutureFactor360 Tools</h1>
      <p>Click a tile to open the demo.</p>
    </div>
  </section>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="footer-inner">© <span id="year"></span> FutureFactor360. All rights reserved.</div>
  </footer>

  <script src="tools.js"></script>
  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      document.getElementById('grid').innerHTML = (window.FF360_TOOLS || []).map(function (t) {
        return '<a class="tile" href="' + esc(t.url) + '" target="_blank" rel="noopener">' +
          '<h2>' + esc(t.name) + '</h2>' +
          '<p>' + esc(t.description) + '</p>' +
          '<span class="open">Open demo <span aria-hidden="true">→</span></span>' +
          '</a>';
      }).join('');
    })();
  </script>
</body>
</html>
